<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NMS Saves Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  </head>
  <body class="p-3">
    <div class="container">
      <h1>NMS Saves Manager <div id="mode">{{mode}}</div></h1>
      
      <div class="btn-group gap-1 my-3" role="group" aria-label="actions">
        <button class="btn btn-primary" id="btnPool">Pool</button>
        <button class="btn btn-primary" id="btnSaves">Saves</button>
        <button class="btn btn-secondary" id="btnHistory">History</button>
        <button class="btn btn-success" id="btnCopyToSaves">Pool to Saves</button>
        <button class="btn btn-success" id="btnCopyToPool">Backup Saves</button>
        <button class="btn btn-primary" id="btnNote">Note</button>
        <button class="btn btn-danger"  id="btnDelete">Delete</button>
      </div>
        <a href="slideshow" class="icon">i</a>
      <!--div style="text-align: center; display: inline-block; width: 100%"></div-->

      <div id="message" class="mb-2">&nbsp;</div>

      <div class="row">
        <div class="col-md-6">
          <h5>Pool</h5>
          <ul class="list-group" id="leftList"></ul>
        </div>
        <div class="col-md-6">
          <h5>Saves</h5>
          <ul class="list-group" id="rightList"></ul>
        </div>
      </div>
    </div>

    <!-- Note Modal (add before </body> in index2.html) -->
    <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="noteLabel">Edit Note for Slot <span id="noteSlot"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <textarea class="form-control" id="noteContent" rows="5" placeholder="Enter your note here..."></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="deleteNoteBtn" style="display: none;">Delete Note</button>
            <button type="button" class="btn btn-primary" id="saveNoteBtn">Save Note</button>
          </div>

        </div>
      </div>
    </div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Add this script tag after jQuery and before your custom <script> in index2.html -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- <script src="static/js/app.js"></script> -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<div id="debugState">
  <b>Debug:</b> waiting for events...
</div>
<div id="appVer">{{ver}}</div>
  </body>
</html>
